[package]
name = "web_host"
version = "0.1.0"
authors = ["Matthew Berger <matthewjordanberger@gmail.com>"]
description = "A minimal web host application for the Nightshade game engine"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.90"

[[bin]]
name = "web_host"
path = "src/main.rs"

[dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nightshade = { workspace = true, features = ["egui"] }
wry = "0.53.5"
include_dir = "0.7.4"
tiny_http = "0.12.0"

[build-dependencies]
