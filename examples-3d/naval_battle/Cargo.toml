[package]
name = "naval_battle"
description = "Naval battle game with ships bobbing on an infinite ocean, cannon combat, and wave-based enemy spawning"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2024"

[features]
openxr = ["nightshade/openxr"]

[dependencies]
nightshade = { workspace = true, features = ["egui", "tracing", "physics"] }
rand = { version = "0.9", features = ["small_rng"] }
