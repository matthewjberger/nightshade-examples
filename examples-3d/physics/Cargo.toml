[package]
name = "physics"
description = "Physics interactions with grabbable objects, doors, drawers, levers, and wheels"
version = "0.1.0"
authors = ["Matthew Berger <matthewjordanberger@gmail.com>"]
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.92"

[features]
openxr = ["nightshade/openxr"]

[dependencies]
nightshade = { workspace = true, features = ["physics", "tracing", "gamepad"] }
stateless = "0.5.0"
