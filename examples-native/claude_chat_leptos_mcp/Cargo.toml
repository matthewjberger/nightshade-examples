[workspace]
resolver = "2"
members = [".", "site", "protocol"]

[package]
name = "claude-chat-leptos-mcp"
version = "0.1.0"
authors = ["Matthew Berger <matthewjordanberger@gmail.com>"]
description = "Chat UI with MCP-powered toast notifications using nightshade webview with a Leptos frontend"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.90"
publish = false

[[bin]]
name = "claude-chat-leptos-mcp"
path = "src/main.rs"

[dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nightshade = { git = "https://github.com/matthewjberger/nightshade.git", default-features = false, features = [
    "runtime",
    "wgpu",
    "egui",
    "webview",
    "claude",
    "mcp",
    "assets",
] }
include_dir = "0.7"
serde = "1"
claude_chat_mcp_protocol = { path = "protocol" }

[build-dependencies]

[patch."https://github.com/matthewjberger/nightshade.git"]
nightshade = { path = "../../../nightshade/crates/nightshade" }

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"
