[package]
name = "hot_reload"
description = "Asset hot-reload test: edit a PNG or material JSON on disk and see it update live in the viewport"
version = "0.1.0"
authors = ["Matthew Berger <matthewjordanberger@gmail.com>"]
edition = "2024"

[dependencies]
nightshade = { workspace = true, features = ["egui", "tracing"] }
image = "0.25"
serde_json = "1"
