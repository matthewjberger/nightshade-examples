[package]
name = "widget_gallery"
description = "Interactive showcase of every retained UI widget, theme, and feature"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2024"

[features]
default = ["syntax_highlighting"]
syntax_highlighting = ["nightshade/syntax_highlighting"]

[dependencies]
nightshade = { workspace = true, features = ["tracing"] }

[package.metadata.gallery]
display_name = "Widget Gallery"
