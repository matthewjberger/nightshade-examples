[package]
name = "pong"
description = "Classic Pong game with AI opponent, ball physics, and scoring"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2024"

[features]
default = []
openxr = ["nightshade/openxr"]

[dependencies]
nightshade = { workspace = true, features = ["egui", "tracing"] }
