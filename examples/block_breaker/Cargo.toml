[package]
name = "block_breaker"
description = "Classic brick-breaking game with ECS and physics"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2024"

[features]
default = []
openxr = ["nightshade/openxr"]

[dependencies]
nightshade = { workspace = true, features = ["physics", "tracy", "gamepad"] }
