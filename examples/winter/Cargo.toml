[package]
name = "winter"
description = "Third person character controller with animated fox, procedural terrain, Christmas trees, campfire, and snow particles"
version = "0.1.0"
authors = ["Matthew Berger <matthewjordanberger@gmail.com>"]
edition = "2024"

[features]
openxr = ["nightshade/openxr"]

[dependencies]
nightshade = { workspace = true, features = ["physics", "tracing"] }
