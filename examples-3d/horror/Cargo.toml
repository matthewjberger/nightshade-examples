[package]
name = "horror"
description = "First-person horror demo with flashlight, dynamic shadows, and atmospheric lighting"
version = "0.1.0"
authors = ["Matthew Berger <matthewjordanberger@gmail.com>"]
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.90"

[features]
openxr = ["nightshade/openxr"]

[dependencies]
nightshade = { workspace = true, features = ["egui", "physics", "tracing", "audio", "gamepad"] }
