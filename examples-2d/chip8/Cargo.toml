[package]
name = "chip8"
description = "CHIP-8 emulator with all 35 standard opcodes"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2024"

[features]
default = []
openxr = ["nightshade/openxr"]

[dependencies]
nightshade = { workspace = true, features = ["egui", "tracing"] }
rand = "0.9"
