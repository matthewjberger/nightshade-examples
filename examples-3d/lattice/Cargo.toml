[package]
name = "lattice"
description = "Free-form deformation with 3D lattice control points and trilinear interpolation"
version = "0.1.0"
authors = ["Matthew Berger <matthewjordanberger@gmail.com>"]
edition = "2024"

[features]
openxr = ["nightshade/openxr"]

[dependencies]
nightshade = { workspace = true, features = ["egui", "tracing", "physics", "lattice"] }

[package.metadata.gallery]
display_name = "Lattice Deformation"
