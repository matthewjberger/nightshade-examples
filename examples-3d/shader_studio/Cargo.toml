[package]
name = "shader_studio"
description = "Interactive shader development environment with live WGSL editing and multipass rendering"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2024"

[dependencies]
nightshade = { workspace = true, features = ["egui", "tracing"] }
naga = { version = "27", features = ["wgsl-in"] }
bytemuck = { version = "1", features = ["derive"] }
image = "0.25"
egui-snarl = { git = "https://github.com/zakarumych/egui-snarl", rev = "5bdc34e4ebdb9d7a0968f21564dce51a1a027ee8" }
pollster = "0.4"
