[workspace]
resolver = "2"
members = [
    "examples-2d/*",
    "examples-3d/*",
    "examples-native/*",
    "examples-terminal/*",
]
exclude = [
    "examples-native/plugins",
    "examples-native/webview",
    "examples-native/nightshade_dioxus",
    "examples-native/claude_chat_leptos",
    "examples-native/claude_chat_leptos_mcp",
]

[workspace.dependencies]
nightshade = { git = "https://github.com/matthewjberger/nightshade.git" }

