<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Neon Lights</title>
        <link data-trunk rel="copy-file" href="../../assets/images/icon.png" />
        <link rel="icon" type="image/png" href="icon.png" />
        <base data-trunk-public-url />
        <style type="text/css">
            body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
            .root { width: 100%; height: 100%; display: flex; }
            .main-canvas { display: block; width: 100%; height: 100%; }
        </style>
    </head>
    <body>
        <link data-trunk rel="rust" href="Cargo.toml" data-target-name="neon_lights" />
        <div class="root">
            <canvas class="main-canvas" id="canvas"></canvas>
        </div>
        <script>
            function resizeCanvas() {
                const canvas = document.getElementById("canvas");
                const dpr = window.devicePixelRatio || 1;
                canvas.width = Math.round(window.innerWidth * dpr);
                canvas.height = Math.round(window.innerHeight * dpr);
                canvas.style.width = window.innerWidth + "px";
                canvas.style.height = window.innerHeight + "px";
            }
            resizeCanvas();
            window.addEventListener("resize", resizeCanvas);
        </script>
    </body>
</html>
