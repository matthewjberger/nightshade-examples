[package]
name = "hex_war"
description = "Hex grid strategy game with procedural terrain generation and unit movement"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2024"

[dependencies]
nightshade = { workspace = true, features = ["physics", "tracing"] }
bytemuck = { version = "1", features = ["derive"] }

[features]
openxr = ["nightshade/openxr"]
