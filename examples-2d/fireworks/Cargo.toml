[package]
name = "fireworks"
description = "GPU-driven particle fireworks with multiple explosion types and bloom effects"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2024"

[features]
openxr = ["nightshade/openxr"]

[dependencies]
nightshade = { workspace = true, features = ["egui", "tracing"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
